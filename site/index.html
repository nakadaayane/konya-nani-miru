<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>今夜なに観る？</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Old+Mincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 生成りのグレーに群青とライム、上映時間の帯ごとにポップな色。明るい見た目に固定する */
:root{
  color-scheme:light;
  --bg:#E8E2DF; --paper:#FFFFFF; --ink:#141414; --muted:#5F5955; --faint:#8C8580; --hair:#D6CECA;
  --blue:#1E2BDC; --blue-soft:#E2E4FB; --lime:#E2FF32;
  --mint:#6CCB9F; --sun:#FFD84A; --sky:#A5DAF2; --pink:#FFA9C2; --late:#C0245A;
  --display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:32px 140px;overflow-x:clip}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* ---------- 看板 ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:28px;align-items:end}
.en-label{margin:0 0 12px;font-family:var(--display);font-size:13px;letter-spacing:.16em;color:var(--blue)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(52px,9.5vw,112px);line-height:1;letter-spacing:.01em}
.lede{margin:18px 0 0;max-width:58ch;color:var(--muted)}
.lede b{color:var(--ink);font-weight:700}
.lede b.num{font-weight:400;color:var(--blue);font-size:18px}
.stamp{display:table;margin-top:12px;padding:3px 14px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);font-size:12px;color:var(--ink)}

.hist{display:grid;gap:6px;margin:0;padding:16px 18px 12px;background:var(--paper);border:2px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
.hist-cap{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.hist-cap span:first-child{font-weight:700;color:var(--ink)}
.hist-bars{display:grid;grid-template-columns:repeat(15,1fr);align-items:end;gap:3px;height:78px;border-bottom:2px solid var(--ink)}
.hist-bars span{display:block;background:var(--hair);border-radius:3px 3px 0 0;min-height:2px;transition:background .2s}
.hist-bars span.on{background:var(--blue)}
.hist-ticks{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;font-family:var(--display);font-size:10px;color:var(--faint)}
.hist-ticks span{white-space:nowrap}

/* 観たい作品のポスターが流れる帯 */
.belt{margin:30px -16px 0;overflow:hidden;background:var(--sun);border-block:2px solid var(--ink);padding-block:16px}
.belt-track{display:flex;gap:16px;width:max-content;padding-inline:8px;animation:belt 80s linear infinite}
.belt a{display:block;flex:none}
.belt img{display:block;width:78px;aspect-ratio:5/7;object-fit:cover;background:var(--hair);border:2px solid var(--ink);border-radius:8px}
.belt a:nth-child(odd) img{transform:rotate(-3deg)}
.belt a:nth-child(even) img{transform:rotate(2.5deg)}
.belt:hover .belt-track{animation-play-state:paused}
@keyframes belt{to{transform:translateX(-50%)}}

/* ---------- 見出し（英字＋明朝） ---------- */
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:48px 0 16px}
.sec-head .en{font-family:var(--display);font-size:clamp(32px,5vw,46px);line-height:1}
.sec-head .ja{font-family:var(--mincho);font-size:14px;letter-spacing:.32em;color:var(--blue)}

/* ---------- 絞り込み ---------- */
.controls{display:grid;gap:16px;padding:22px 24px;background:var(--paper);border:2px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
.ctl{display:grid;grid-template-columns:8em 1fr;gap:10px;align-items:start}
.ctl>label,.ctl>.lbl{padding-top:6px;font-size:12.5px;font-weight:700;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.45;white-space:nowrap;transition:background .15s,transform .15s}
.chip:hover{background:var(--lime)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip small{margin-left:5px;font-family:var(--display);font-size:11px;opacity:.75}
.chip:disabled{opacity:.4;cursor:default;background:var(--paper)}
.hint{font-size:12px;color:var(--muted)}
.row-inline{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
input[type="time"],input[type="search"],select{background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:5px 10px;font-size:13px}
input[type="time"]{font-family:var(--display)}
input[type="search"]{width:min(100%,320px)}
input::placeholder{color:var(--faint)}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.switch input{accent-color:var(--blue);width:17px;height:17px}
.more{background:none;border:0;color:var(--blue);cursor:pointer;font-size:13px;font-weight:700;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}

/* ---------- ツールバー ---------- */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;
  padding:10px 2px;background:var(--bg);border-bottom:2px solid var(--ink)}
.count{font-size:13px;color:var(--muted)}
.count b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--blue);margin-right:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:13px;font-weight:700}
.btn:hover{background:var(--lime)}
.btn.lime{background:var(--lime)}
.btn.ghost{border-color:var(--hair);color:var(--muted);font-weight:500}

.picked{margin-top:16px;padding:14px 18px;background:var(--lime);border:2px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.picked .hint{font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--ink)}
.picked b{font-size:17px}

/* ---------- 上映作品（カード） ---------- */
.band{display:flex;align-items:center;gap:12px;width:max-content;max-width:100%;margin:36px 0 16px;padding:8px 10px 8px 20px;
  background:var(--c,var(--paper));border:2px solid var(--ink);border-radius:999px}
.band h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2}
.band span{font-family:var(--display);font-size:13px;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:1px 11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 18px}
.card{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--paper);border:2px solid var(--ink);border-radius:16px;overflow:hidden;
  transition:transform .15s,box-shadow .15s;scroll-margin-top:110px}
.card:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ink)}
.card.hl{outline:4px solid var(--blue);outline-offset:3px;box-shadow:6px 6px 0 var(--ink)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 8px 12px;background:var(--c,var(--paper));border-bottom:2px solid var(--ink)}
.no{font-family:var(--display);font-size:22px;line-height:1;letter-spacing:.02em}
.rt{font-family:var(--display);font-size:12px;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.rt b{font-weight:400;font-size:17px}
.poster{display:block;aspect-ratio:5/7;max-width:100%;background:var(--hair);border-bottom:2px solid var(--ink);overflow:hidden}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.poster .ph{display:grid;place-items:center;height:100%;padding:12px;text-align:center;font-family:var(--display);font-size:18px;color:var(--muted)}
.card-body{display:grid;gap:6px;align-content:start;padding:12px 12px 14px}
.t{margin:0;font-size:15px;font-weight:700;line-height:1.4;text-wrap:balance;overflow-wrap:anywhere}
.t a{text-decoration:none}
.t a:hover{text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:2px;text-underline-offset:3px}
.meta{margin:0;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.times{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:0;font-size:12px}
.clock{font-family:var(--display);font-size:13px;white-space:nowrap}
.clock .late{color:var(--late)}
.score{white-space:nowrap;color:var(--muted)}
.score b{font-family:var(--display);font-weight:400;font-size:14px;color:var(--blue)}
.vod{display:flex;flex-wrap:wrap;gap:4px}
.v{font-size:10.5px;line-height:1.45;padding:1px 8px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);text-decoration:none;white-space:nowrap}
.v:hover{background:var(--lime)}
.v.svod{background:var(--blue-soft);font-weight:700}
.v.mine{background:var(--blue);border-color:var(--blue);color:#fff}
.v.theater{background:var(--pink)}
.v.none{border-style:dashed;border-color:var(--faint);color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.b{font-size:10.5px;font-weight:700;line-height:1.45;padding:1px 7px;border-radius:6px;white-space:nowrap}
.b.clip{background:var(--lime);border:1.5px solid var(--ink)}
.b.rank{border:1.5px solid var(--hair);color:var(--muted);font-weight:500}
.b.rank b{font-family:var(--display);font-weight:400;color:var(--ink)}
.b.award{background:var(--sun);border:1.5px solid var(--ink)}
.b.sim{background:var(--pink);border:1.5px solid var(--ink)}
.b.seen{border:1.5px dashed var(--faint);color:var(--muted)}
details{font-size:12px}
summary{cursor:pointer;color:var(--blue);font-weight:700;width:max-content}
details p{margin:6px 0 0;color:var(--ink)}
.people{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:4px 12px}
.links a{color:var(--blue)}

.more-wrap{display:flex;justify-content:center;margin-top:30px}
.more-wrap .btn{padding:10px 26px;font-size:14px;box-shadow:4px 4px 0 var(--ink)}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.fin{display:grid;justify-items:center;gap:10px;margin:80px 0 0}
.fin .en{font-family:var(--display);font-size:clamp(44px,8vw,76px);line-height:1}
.fin .ja{font-family:var(--mincho);font-size:14px;letter-spacing:.32em;color:var(--blue)}
.foot{margin:20px auto 0;max-width:62ch;text-align:center;font-size:12px;color:var(--faint)}

/* おまかせのステッカー（右下で回る） */
.sticker{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:120px;height:120px;padding:0;
  display:grid;place-items:center;border-radius:50%;border:2px solid var(--ink);background:var(--lime);cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .15s}
.sticker:hover{transform:translate(-2px,-2px) rotate(-6deg)}
.sticker svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);animation:spin 18s linear infinite}
.sticker text{font-family:var(--display);font-size:10px;fill:var(--ink)}
.sticker-label{position:relative;display:grid;justify-items:center;font-size:12px;font-weight:700;line-height:1.15}
.sticker-label b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:22px}
  .controls{padding:18px 16px;border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
  .ctl{grid-template-columns:1fr;gap:5px}
  .ctl>label,.ctl>.lbl{padding-top:0}
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
  .card-top{padding:6px 7px 6px 9px}
  .no{font-size:17px}
  .rt{padding:1px 7px}
  .rt b{font-size:14px}
  .card-body{padding:9px 9px 12px;gap:5px}
  .t{font-size:13.5px}
  .band h2{font-size:17px}
  .sticker{width:94px;height:94px;right:12px}
  .sticker text{font-size:9px}
  .sticker-label{font-size:10.5px}
  .sticker-label b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="hero">
    <div>
      <p class="en-label">WHAT TO WATCH TONIGHT</p>
      <h1>今夜<br>なに観る？</h1>
      <p class="lede" id="lede"></p>
    </div>
    <figure class="hist" aria-label="上映時間の分布">
      <figcaption class="hist-cap"><span>上映時間の分布（10分きざみ）</span><span id="histNote"></span></figcaption>
      <div class="hist-bars" id="histBars"></div>
      <div class="hist-ticks" id="histTicks"></div>
    </figure>
  </header>
  <div class="belt" aria-hidden="true"><div class="belt-track" id="belt"></div></div>

  <div class="sec-head"><span class="en">FILTER</span><span class="ja">条件をえらぶ</span></div>
  <section class="controls" aria-label="絞り込み">
    <div class="ctl">
      <span class="lbl">リスト</span>
      <div>
        <div class="chips" id="pool"></div>
        <p class="hint" id="poolHint" style="margin:6px 0 0"></p>
      </div>
    </div>
    <div class="ctl" id="kindRow">
      <span class="lbl">おすすめの種類</span>
      <div class="chips" id="kinds"></div>
    </div>
    <div class="ctl">
      <span class="lbl">観る場所</span>
      <div class="chips" id="where"></div>
    </div>
    <div class="ctl" id="svcRow">
      <span class="lbl">契約中の配信</span>
      <div>
        <div class="chips" id="services"></div>
        <div class="row-inline" style="margin-top:8px">
          <label class="switch"><input type="checkbox" id="svodOnly"> 見放題だけ（レンタル・購入を除く）</label>
          <span class="hint" id="svcHint">選んだサービスは次回も覚えています</span>
        </div>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl">使える時間</span>
      <div>
        <div class="chips" id="runtime"></div>
        <div class="row-inline" style="margin-top:8px">
          <label class="switch" for="start">観はじめる時刻</label>
          <input type="time" id="start" step="300">
          <button class="more" id="nowBtn" type="button">今から</button>
          <span class="hint" id="rtHint"></span>
        </div>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl">ジャンル</span>
      <div class="chips" id="genres"></div>
    </div>
    <div class="ctl">
      <span class="lbl">国・評価</span>
      <div class="row-inline">
        <select id="country" aria-label="製作国"></select>
        <select id="minScore" aria-label="評価">
          <option value="0">評価：こだわらない</option>
          <option value="3.5">★3.5以上</option>
          <option value="3.8">★3.8以上</option>
          <option value="4">★4.0以上</option>
        </select>
        <input type="search" id="q" placeholder="タイトル・監督・出演者で検索">
      </div>
    </div>
  </section>

  <div class="sec-head"><span class="en">LINEUP</span><span class="ja">今夜の上映作品</span></div>
  <div class="toolbar">
    <div class="count" id="count"></div>
    <div class="tools">
      <select id="sort" aria-label="並び順">
        <option value="runtime-asc">上映時間が短い順</option>
        <option value="runtime-desc">上映時間が長い順</option>
        <option value="score-desc">評価が高い順</option>
        <option value="clips-desc">観たい人が多い順</option>
        <option value="rank-asc">ランキングの順位順</option>
        <option value="similar-desc">観たいに似ている順</option>
        <option value="year-desc">新しい作品から</option>
        <option value="year-asc">古い作品から</option>
        <option value="order-asc">観たいに入れた新しい順</option>
        <option value="order-desc">観たいに入れた古い順</option>
        <option value="title-asc">タイトル順</option>
      </select>
      <button class="btn ghost" id="resetBtn" type="button">条件をリセット</button>
    </div>
  </div>
  <div id="picked"></div>

  <main id="list"></main>
  <div class="more-wrap" id="moreWrap" hidden><button class="btn lime" type="button" id="moreBtn"></button></div>
  <div class="fin" id="fin" hidden><span class="en">THE END</span><span class="ja">今夜も、いい映画を。</span></div>
  <p class="foot" id="foot"></p>
</div>

<button class="sticker" id="pickBtn" type="button" aria-label="条件に合う作品からおまかせで1本えらぶ">
  <svg viewBox="0 0 120 120" aria-hidden="true"><defs><path id="ring" d="M60,60 m-47,0 a47,47 0 1,1 94,0 a47,47 0 1,1 -94,0"/></defs>
    <text><textPath href="#ring" textLength="292" lengthAdjust="spacing">PICK ONE FOR TONIGHT ● PICK ONE FOR TONIGHT ●</textPath></text></svg>
  <span class="sticker-label">おまかせで<b>1本</b></span>
</button>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = new Date().toISOString().slice(0,10);
const KEY = "konya-nani-miru-v2";
const POOL_OPTS = [
  {id:"clip", label:"観たい"},
  {id:"pick", label:"観たい以外のおすすめ"},
  {id:"all", label:"ぜんぶ"},
];
const KIND_OPTS = [
  {id:"vod", label:"配信の人気作", test: m => m.ranks.some(r => r.list !== "今話題")},
  {id:"trend", label:"今話題", test: m => m.ranks.some(r => r.list === "今話題")},
  {id:"similar", label:"観たいに似ている", test: m => m.similar > 0},
  {id:"award", label:"映画賞", test: m => (m.awards || []).length > 0},
];
const STEP = 100;  // 一度に表示する本数
const RUNTIME_OPTS = [
  {id:"all", label:"こだわらない", min:0, max:Infinity},
  {id:"90", label:"〜90分", min:0, max:90},
  {id:"120", label:"〜2時間", min:0, max:120},
  {id:"150", label:"〜2時間半", min:0, max:150},
  {id:"long", label:"2時間半より長い", min:151, max:Infinity},
];
const WHERE_OPTS = [
  {id:"home", label:"家で（配信あり）"},
  {id:"theater", label:"映画館で上映中"},
  {id:"all", label:"すべて"},
];
const DEFAULTS = {kinds:[], pool:"clip", where:"home", services:["U-NEXT","Prime Video"], svodOnly:false, runtime:"all", start:"", genres:[], country:"", minScore:0, q:"", sort:"runtime-asc"};
let DATA = null, MOVIES = [], SERVICES = [], GENRES = [];
let state = load();
let pickedId = null;
let showAllGenres = false;
let limit = STEP;

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY) || "{}"); return {...DEFAULTS, ...s, q:""}; }
  catch(e){ return {...DEFAULTS}; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- derived ---------- */
const isSvod = v => v.kinds.some(k => k.includes("見放題"));
const inTheater = m => m.status === "上映中" || m.theaters > 0;
const upcoming = m => m.release && m.release > TODAY;
const bestRank = m => m.ranks && m.ranks.length ? Math.min(...m.ranks.map(r => r.rank)) : null;
function countBy(list){ const c = new Map(); list.forEach(x => c.set(x,(c.get(x)||0)+1)); return [...c].sort((a,b)=>b[1]-a[1]); }

function startMinutes(){
  if(state.start){ const [h,mm] = state.start.split(":").map(Number); return h*60+mm; }
  const d = new Date(); return Math.ceil((d.getHours()*60+d.getMinutes())/5)*5;
}
function hhmm(total){
  const day = Math.floor(total/1440), t = ((total%1440)+1440)%1440;
  return (day>0?"翌":"") + Math.floor(t/60) + ":" + String(t%60).padStart(2,"0");
}
function fmtLen(min){ const h = Math.floor(min/60), m = min%60; return h ? `${h}時間${m?m+"分":""}` : `${m}分`; }
function fmtStamp(s){ const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(s || ""); return m ? `${Number(m[2])}月${Number(m[3])}日 ${m[4]}` : (s || ""); }

function vodMatches(m){
  let v = m.vod;
  if(state.services.length) v = v.filter(x => state.services.includes(x.name));
  if(state.svodOnly) v = v.filter(isSvod);
  return v.length > 0;
}
/** skip: 件数を数えるとき、その条件だけ外して数えるためのキー */
function passes(m, skip){
  if(skip !== "pool" && state.pool !== "all" && m.source !== state.pool) return false;
  if(skip !== "kind" && state.pool === "pick" && state.kinds.length &&
     !KIND_OPTS.filter(k => state.kinds.includes(k.id)).some(k => k.test(m))) return false;
  if(skip !== "where"){
    if(state.where === "home" && !vodMatches(m)) return false;
    if(state.where === "theater" && !inTheater(m)) return false;
  }
  if(skip !== "runtime"){
    const r = RUNTIME_OPTS.find(o => o.id === state.runtime) || RUNTIME_OPTS[0];
    if(r.id !== "all" && (m.runtime == null || m.runtime < r.min || m.runtime > r.max)) return false;
  }
  if(skip !== "genre" && state.genres.length && !m.genres.some(g => state.genres.includes(g))) return false;
  if(skip !== "country"){
    if(state.country === "__jp" && !m.countries.includes("日本")) return false;
    if(state.country === "__foreign" && (m.countries.includes("日本") || !m.countries.length)) return false;
    if(state.country && !state.country.startsWith("__") && !m.countries.includes(state.country)) return false;
  }
  if(state.minScore && !(m.score >= state.minScore)) return false;
  if(state.q){
    const hay = [m.title, m.original, ...m.directors, ...m.cast].join(" ").toLowerCase();
    if(!state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;
  }
  return true;
}
function countWith(key, value, skip){
  const keep = state[key]; state[key] = value;
  const n = MOVIES.filter(m => passes(m, skip)).length;
  state[key] = keep; return n;
}
const nullLast = (a,b,f) => (a==null) - (b==null) || (a==null ? 0 : f(a,b));
const SORTS = {
  "runtime-asc": (a,b) => nullLast(a.runtime,b.runtime,(x,y)=>x-y) || (b.score||0)-(a.score||0),
  "runtime-desc": (a,b) => nullLast(a.runtime,b.runtime,(x,y)=>y-x) || (b.score||0)-(a.score||0),
  "score-desc": (a,b) => nullLast(a.score,b.score,(x,y)=>y-x) || (b.clips||0)-(a.clips||0),
  "clips-desc": (a,b) => (b.clips||0)-(a.clips||0),
  "rank-asc": (a,b) => nullLast(bestRank(a),bestRank(b),(x,y)=>x-y) || (b.score||0)-(a.score||0),
  "similar-desc": (a,b) => (b.similar||0)-(a.similar||0) || (b.score||0)-(a.score||0),
  "year-desc": (a,b) => nullLast(a.release||a.year,b.release||b.year,(x,y)=>String(y).localeCompare(String(x))),
  "year-asc": (a,b) => nullLast(a.release||a.year,b.release||b.year,(x,y)=>String(x).localeCompare(String(y))),
  "order-asc": (a,b) => a.order-b.order,
  "order-desc": (a,b) => b.order-a.order,
  "title-asc": (a,b) => a.title.localeCompare(b.title,"ja"),
};
function band(m){
  const r = m.runtime;
  if(r == null) return "上映時間の登録なし";
  if(r < 90) return "90分未満";
  if(r < 120) return "90〜119分";
  if(r < 150) return "2時間〜2時間29分";
  return "2時間半以上";
}

/* ---------- controls ---------- */
function chip(label, pressed, data, count, disabled){
  return `<button type="button" class="chip" aria-pressed="${pressed}" ${data}${disabled?" disabled":""}>${esc(label)}${count!=null?`<small>${count}</small>`:""}</button>`;
}
function renderControls(){
  $("pool").innerHTML = POOL_OPTS.map(o => chip(o.label, state.pool===o.id, `data-pool="${o.id}"`, countWith("pool", o.id))).join("");
  const L = DATA.lists || {};
  const svc = Object.keys(L).filter(k => k !== "今話題").map(k => k.replace("人気","")).join("・");
  $("poolHint").textContent = state.pool === "clip"
    ? "Filmarksで「観たい」に入れた作品です。"
    : `観たい以外は、${svc}の人気上位、今話題の映画、観たいに似ている作品（上位${DATA.similar_top || 0}本）、${(DATA.awards || []).join("・")}の受賞作です。観た作品（${DATA.marks}本）と観たい作品は除いています。`;
  $("kindRow").hidden = state.pool !== "pick";
  $("kinds").innerHTML = KIND_OPTS.map(k => {
    const n = MOVIES.filter(m => passes(m, "kind") && k.test(m)).length;
    return chip(k.label, state.kinds.includes(k.id), `data-kind="${k.id}"`, n);
  }).join("");

  $("where").innerHTML = WHERE_OPTS.map(o => chip(o.label, state.where===o.id, `data-where="${o.id}"`, countWith("where", o.id))).join("");
  const home = state.where === "home";
  $("svcRow").style.opacity = home ? "" : ".5";
  $("services").innerHTML = SERVICES.map(([name]) => {
    const n = MOVIES.filter(m => passes(m, "where") && m.vod.some(v => v.name === name && (!state.svodOnly || isSvod(v)))).length;
    return chip(name, state.services.includes(name), `data-svc="${esc(name)}"`, n, !home);
  }).join("");
  $("svodOnly").checked = state.svodOnly; $("svodOnly").disabled = !home;
  $("svcHint").textContent = state.services.length
    ? `${state.services.join("・")}で観られる作品だけ表示中。選んだサービスは次回も覚えています`
    : "何も選ばなければ、どこかで配信している作品をすべて表示します";

  $("runtime").innerHTML = RUNTIME_OPTS.map(o => chip(o.label, state.runtime===o.id, `data-rt="${o.id}"`, countWith("runtime", o.id))).join("");
  const s = startMinutes(), r = RUNTIME_OPTS.find(o => o.id === state.runtime);
  $("start").value = hhmm(s).replace("翌","").padStart(5,"0");
  $("rtHint").textContent = r && isFinite(r.max) && r.min === 0
    ? `${hhmm(s)}に観はじめて ${hhmm(s + r.max)} までに終わる作品`
    : `右端に「${hhmm(s)}に観はじめたら何時に終わるか」を出しています`;

  const g = showAllGenres ? GENRES : GENRES.slice(0, 12);
  $("genres").innerHTML = g.map(([name]) => {
    const n = MOVIES.filter(m => m.genres.includes(name) && passes(m, "genre")).length;
    return chip(name, state.genres.includes(name), `data-genre="${esc(name)}"`, n);
  }).join("") + (GENRES.length > 12 ? `<button class="more" type="button" id="moreGenres">${showAllGenres ? "閉じる" : `ほか${GENRES.length-12}ジャンル`}</button>` : "");

  const base = MOVIES.filter(m => passes(m, "country"));
  const jp = base.filter(m => m.countries.includes("日本")).length;
  $("country").innerHTML = `<option value="">国：すべて（${base.length}）</option><option value="__jp">日本の作品（${jp}）</option><option value="__foreign">日本以外（${base.length-jp}）</option>` +
    countBy(base.flatMap(m => m.countries)).filter(([c]) => c !== "日本").slice(0, 15).map(([c,n]) => `<option value="${esc(c)}">${esc(c)}（${n}）</option>`).join("");
  $("country").value = state.country;
  if($("country").value !== state.country) $("country").value = "";
  $("minScore").value = String(state.minScore);
  $("sort").value = state.sort;
  if($("q").value !== state.q) $("q").value = state.q;
}

/* ---------- header ---------- */
function renderHeader(list){
  const clips = MOVIES.filter(m => m.source === "clip");
  const picks = MOVIES.length - clips.length;
  const total = clips.reduce((s,m) => s + (m.runtime||0), 0);
  $("lede").innerHTML = `Filmarksで「観たい」に入れた映画 <b class="num">${clips.length}</b>本（全部観ると <b>${Math.floor(total/60)}時間</b>）と、観たい以外のおすすめ <b class="num">${picks}</b>本。` +
    `<span class="stamp">${esc(fmtStamp(DATA.fetched_at))} 更新・${esc(DATA.update_note || "")}</span>`;
  const pool = MOVIES.filter(m => state.pool === "all" || m.source === state.pool);
  const buckets = Array(15).fill(0), on = Array(15).fill(0);
  const idx = r => r < 60 ? 0 : Math.min(14, Math.floor((r-60)/10)+1);
  pool.forEach(m => { if(m.runtime != null) buckets[idx(m.runtime)]++; });
  list.forEach(m => { if(m.runtime != null) on[idx(m.runtime)]++; });
  const max = Math.max(1, ...buckets);
  $("histBars").innerHTML = buckets.map((n,i) => {
    const lo = i===0 ? "60分未満" : i===14 ? "190分以上" : `${60+(i-1)*10}〜${69+(i-1)*10}分`;
    return `<span class="${on[i] ? "on" : ""}" style="height:${n/max*100}%" title="${lo}：${n}本（表示中 ${on[i]}本）"></span>`;
  }).join("");
  const ticks = {0:"〜59", 4:"90", 7:"120", 10:"150", 13:"180"};
  $("histTicks").innerHTML = buckets.map((_,i) => `<span>${ticks[i] ?? ""}</span>`).join("");
  $("histNote").textContent = `${POOL_OPTS.find(o => o.id === state.pool).label}・色つき＝いまの条件`;
}

/* ---------- list ---------- */
function vodChips(m){
  const mine = new Set(state.services);
  const out = [];
  if(inTheater(m)) out.push(`<a class="v theater" href="${esc(m.url)}/theaters" target="_blank" rel="noopener">映画館で上映中${m.theaters ? ` ${m.theaters}館` : ""}</a>`);
  else if(upcoming(m)) out.push(`<span class="v theater">${esc(m.release.replace(/-/g,"/"))} 公開</span>`);
  const vods = [...m.vod].sort((a,b) => (mine.has(b.name)-mine.has(a.name)) || (isSvod(b)-isSvod(a)));
  // 札は契約中のサービスだけ（未選択なら見放題を3社まで）。ほかは「ほか◯社」にまとめてカードを短く保つ
  let shown = state.services.length ? vods.filter(v => mine.has(v.name)) : vods.filter(isSvod).slice(0, 3);
  if(!shown.length) shown = vods.slice(0, state.services.length ? 1 : 2);
  const rest = vods.length - shown.length;
  shown.forEach(v => {
    const cls = ["v", isSvod(v) ? "svod" : "", mine.has(v.name) && (!state.svodOnly || isSvod(v)) ? "mine" : ""].join(" ");
    out.push(`<a class="${cls}" href="${esc(v.href)}" target="_blank" rel="noopener nofollow">${esc(v.name)} ${esc(v.kinds.join("・"))}</a>`);
  });
  if(rest) out.push(`<a class="v none" href="${esc(m.url)}/vod" target="_blank" rel="noopener">ほか${rest}社</a>`);
  if(!m.vod.length && !inTheater(m) && !upcoming(m)) out.push(`<span class="v none">配信なし</span>`);
  return out.join("");
}
function badges(m){
  const out = [];
  if(m.source === "clip" && state.pool !== "clip") out.push(`<span class="b clip">観たい</span>`);
  if(m.watched) out.push(`<span class="b seen">観た</span>`);
  (m.awards || []).forEach(a => out.push(`<span class="b award">${esc(a)}</span>`));
  if(m.similar) out.push(`<span class="b sim">観たい${m.similar}本に似ている</span>`);
  (m.ranks || []).forEach(r => out.push(`<span class="b rank">${esc(r.list)} <b>${r.rank}位</b></span>`));
  return out.length ? `<div class="badges">${out.join("")}</div>` : "";
}
const BAND_COLOR = {"90分未満":"var(--mint)","90〜119分":"var(--sun)","2時間〜2時間29分":"var(--sky)","2時間半以上":"var(--pink)","上映時間の登録なし":"var(--paper)"};
function card(m, start, no){
  const endMin = m.runtime ? start + m.runtime : null;
  const meta = [m.year && `${m.year}年`, m.countries.slice(0,2).join("・"), m.genres.slice(0,2).join("・")].filter(Boolean).map(esc).join(" ／ ");
  const people = [
    m.directors.length ? `監督 ${esc(m.directors.join("、"))}` : "",
    m.cast.length ? `出演 ${esc(m.cast.slice(0,4).join("、"))}` : "",
  ].filter(Boolean).join("　");
  const links = [
    `<a href="${esc(m.url)}" target="_blank" rel="noopener">${m.source === "pick" ? "Filmarksで開く（観たいに追加できます）" : "Filmarksで開く"}</a>`,
    m.trailer ? `<a href="${esc(m.trailer)}" target="_blank" rel="noopener nofollow">予告編</a>` : "",
    m.official ? `<a href="${esc(m.official)}" target="_blank" rel="noopener nofollow">公式サイト</a>` : "",
    `<a href="${esc(m.url)}/vod" target="_blank" rel="noopener">配信サービスをすべて見る</a>`,
  ].filter(Boolean).join("");
  const clock = endMin != null
    ? `<span class="clock">${hhmm(start)} → <span${endMin >= 1440 ? ' class="late"' : ""}>${hhmm(endMin)}</span></span>` : "";
  return `<article class="card${m.id===pickedId?" hl":""}" id="m-${m.id}" style="--c:${BAND_COLOR[band(m)]}">
    <div class="card-top"><span class="no">${String(no).padStart(3,"0")}</span><span class="rt">${m.runtime ? `<b>${m.runtime}</b>分` : "時間未登録"}</span></div>
    <a class="poster" href="${esc(m.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${m.poster ? `<img src="${m.poster}" alt="" loading="lazy" decoding="async">` : `<span class="ph">${esc(m.title.slice(0,8))}</span>`}</a>
    <div class="card-body">
      ${badges(m)}
      <h3 class="t"><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a></h3>
      ${meta ? `<p class="meta">${meta}</p>` : ""}
      <p class="times">${clock}<span class="score"><b>★${m.score != null ? m.score.toFixed(1) : "—"}</b> 観たい${(m.clips||0).toLocaleString()}人</span></p>
      <div class="vod">${vodChips(m)}</div>
      <details><summary>${m.synopsis ? "あらすじ・くわしく" : "くわしく"}</summary>${m.original ? `<p>${esc(m.original)}</p>` : ""}${people ? `<p class="people">${people}</p>` : ""}${m.synopsis ? `<p>${esc(m.synopsis)}</p>` : ""}<p class="links">${links}</p></details>
    </div>
  </article>`;
}
function render(){
  let list = MOVIES.filter(m => passes(m)).sort(SORTS[state.sort] || SORTS["runtime-asc"]);
  renderControls();
  renderHeader(list);
  const mins = list.reduce((s,m) => s + (m.runtime||0), 0);
  $("count").innerHTML = `<b>${list.length}</b> 本表示中・合計 ${fmtLen(mins)}`;
  const start = startMinutes();
  const all = list;
  list = list.slice(0, limit);
  const rest = all.length - list.length;
  $("moreWrap").hidden = !rest;
  $("moreBtn").textContent = `もっと見る（あと${rest}本）`;
  $("fin").hidden = !list.length || rest > 0;
  if(!list.length){
    $("list").innerHTML = `<p class="empty">この条件に合う作品はありません。「条件をリセット」で最初の状態に戻せます。</p>`;
  } else if(state.sort.startsWith("runtime")){
    const bandTotal = {};
    all.forEach(m => { const b = band(m); bandTotal[b] = (bandTotal[b] || 0) + 1; });
    let html = "", cur = null, buf = [], no = 0;
    const flush = () => { if(cur){ html += `<div class="band" style="--c:${BAND_COLOR[cur]}"><h2>${cur}</h2><span>${bandTotal[cur]}本</span></div><div class="grid">${buf.map(m=>card(m,start,++no)).join("")}</div>`; } };
    list.forEach(m => { const b = band(m); if(b !== cur){ flush(); cur = b; buf = []; } buf.push(m); });
    flush();
    $("list").innerHTML = html;
  } else {
    $("list").innerHTML = `<div class="grid">${list.map((m,i)=>card(m,start,i+1)).join("")}</div>`;
  }
  $("foot").textContent = `データ：Filmarks（${fmtStamp(DATA.fetched_at)} 時点）。配信状況と評価は取得時点のもので、最新の状況は各サービスでご確認ください。${DATA.failed.length ? `取得できなかった観たい作品：${DATA.failed.length}本。` : ""}`;
  save();
  return all;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b || !DATA) return;
  if(b.id === "moreBtn"){ limit += STEP; render(); return; }
  limit = STEP;  // 条件を変えたら先頭の100本から出し直す
  if(b.dataset.pool){ state.pool = b.dataset.pool; }
  else if(b.dataset.kind){ const k = b.dataset.kind; state.kinds = state.kinds.includes(k) ? state.kinds.filter(x=>x!==k) : [...state.kinds, k]; }
  else if(b.dataset.where){ state.where = b.dataset.where; }
  else if(b.dataset.svc){ const s = b.dataset.svc; state.services = state.services.includes(s) ? state.services.filter(x=>x!==s) : [...state.services, s]; }
  else if(b.dataset.rt){ state.runtime = b.dataset.rt; }
  else if(b.dataset.genre){ const g = b.dataset.genre; state.genres = state.genres.includes(g) ? state.genres.filter(x=>x!==g) : [...state.genres, g]; }
  else if(b.id === "moreGenres"){ showAllGenres = !showAllGenres; }
  else if(b.id === "nowBtn"){ state.start = ""; }
  else if(b.id === "resetBtn"){ state = {...DEFAULTS, pool: state.pool, services: state.services}; pickedId = null; $("picked").innerHTML = ""; }
  else if(b.id === "pickBtn"){ pick(); return; }
  else return;
  render();
});
$("svodOnly").addEventListener("change", e => { limit = STEP; state.svodOnly = e.target.checked; render(); });
$("start").addEventListener("change", e => { limit = STEP; state.start = e.target.value; render(); });
$("country").addEventListener("change", e => { limit = STEP; state.country = e.target.value; render(); });
$("minScore").addEventListener("change", e => { limit = STEP; state.minScore = Number(e.target.value); render(); });
$("sort").addEventListener("change", e => { limit = STEP; state.sort = e.target.value; render(); });
let qTimer;
$("q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); limit = STEP; if(DATA) render(); }, 150); });

function pick(){
  const list = MOVIES.filter(m => passes(m));
  if(!list.length){ $("picked").innerHTML = `<div class="picked">条件に合う作品がないので選べませんでした。条件をゆるめてからもう一度どうぞ。</div>`; return; }
  const pool = list.filter(m => m.id !== pickedId);
  const src = pool.length ? pool : list;
  const m = src[Math.floor(Math.random() * src.length)];
  pickedId = m.id;
  const sorted = list.sort(SORTS[state.sort] || SORTS["runtime-asc"]);
  const pos = sorted.findIndex(x => x.id === m.id);
  if(pos >= limit) limit = Math.ceil((pos + 1) / STEP) * STEP;
  const start = startMinutes();
  $("picked").innerHTML = `<div class="picked"><span class="hint">TONIGHT'S PICK</span><b>${esc(m.title)}</b><span class="num">${m.runtime ? `${m.runtime}分・${hhmm(start)} → ${hhmm(start+m.runtime)}` : ""}</span><button class="more" type="button" id="pickBtn2">別のにする</button></div>`;
  render();
  $("pickBtn2").onclick = pick;
  document.getElementById("m-" + m.id)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}

/* ---------- boot ---------- */
$("list").innerHTML = `<p class="empty">作品データを読み込んでいます…</p>`;
fetch("data.json", {cache: "no-cache"})
  .then(r => { if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(d => {
    DATA = d; MOVIES = d.movies;
    SERVICES = countBy(MOVIES.flatMap(m => [...new Set(m.vod.map(v => v.name))]));
    GENRES = countBy(MOVIES.flatMap(m => m.genres));
    state.services = state.services.filter(s => SERVICES.some(([n]) => n === s));
    const belt = MOVIES.filter(m => m.source === "clip" && m.poster).sort((a,b) => (b.score||0)-(a.score||0)).slice(0, 18)
      .map(m => `<a href="${esc(m.url)}" target="_blank" rel="noopener" tabindex="-1"><img src="${m.poster}" alt="" decoding="async"></a>`).join("");
    $("belt").innerHTML = belt + belt;  // 2周分並べて切れ目なく流す
    render();
    setInterval(() => { if(!state.start) render(); }, 5 * 60 * 1000);
  })
  .catch(e => { $("list").innerHTML = `<p class="empty">作品データ（data.json）を読み込めませんでした：${esc(e.message)}。ページを再読み込みしてください。</p>`; });
</script>
