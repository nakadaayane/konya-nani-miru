<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>今夜なに観る？</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#E8E2DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今夜なに観る">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 生成りのグレーに群青とライム、上映時間の帯ごとにポップな色。明るい見た目に固定する */
:root{
  color-scheme:light;
  --bg:#E8E2DF; --paper:#FFFFFF; --ink:#141414; --muted:#5F5955; --faint:#8C8580; --hair:#D6CECA;
  --blue:#1E2BDC; --blue-soft:#E2E4FB; --lime:#E2FF32;
  --mint:#6CCB9F; --sun:#FFD84A; --sky:#A5DAF2; --pink:#FFA9C2; --late:#C0245A;
  --display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6;position:relative;
  background:radial-gradient(circle at 1px 1px,rgba(20,20,20,.085) 1.1px,transparent 1.7px) 0 0/16px 16px,var(--bg)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:70px 140px;overflow-x:clip}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* ---------- 映画館の舞台（飾り。文字の後ろに置き、押せないようにする） ---------- */
.stage-deco{position:absolute;left:0;right:0;top:0;height:min(760px,100vh);overflow:hidden;pointer-events:none;z-index:0;
  background:radial-gradient(60% 70% at 50% 0%,rgba(165,218,242,.55),transparent 70%)}
.valance{position:absolute;left:0;top:0;display:block}
.spark{position:absolute;height:auto;animation:twinkle 3.4s ease-in-out var(--d,0s) infinite}
@keyframes twinkle{0%,100%{transform:scale(.55) rotate(0deg);opacity:.55}50%{transform:scale(1) rotate(25deg);opacity:1}}
.drape{position:absolute;top:0;width:clamp(0px,calc((100vw - 1180px) / 2 - 8px),150px);height:560px;display:none;transform-origin:50% 0;animation:sway 6s ease-in-out infinite}
.drape-l{left:0}
.drape-r{right:0;transform:scaleX(-1);animation-name:swayR}
@keyframes sway{0%,100%{transform:skewX(0deg)}50%{transform:skewX(1.6deg)}}
@keyframes swayR{0%,100%{transform:scaleX(-1) skewX(0deg)}50%{transform:scaleX(-1) skewX(1.6deg)}}
.filmstrip{display:none;position:fixed;top:0;bottom:0;width:38px;z-index:0;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='38' height='176'><rect width='38' height='176' fill='%23141414'/><rect x='4' y='7' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='28' y='7' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='4' y='29' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='28' y='29' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='4' y='51' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='28' y='51' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='4' y='73' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='28' y='73' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='4' y='95' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='28' y='95' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='4' y='117' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='28' y='117' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='4' y='139' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='28' y='139' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='4' y='161' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='28' y='161' width='6' height='8' rx='1.5' fill='%23E8E2DF'/><rect x='13' y='4' width='12' height='36' rx='2' fill='%236CCB9F'/><rect x='13' y='48' width='12' height='36' rx='2' fill='%23FFD84A'/><rect x='13' y='92' width='12' height='36' rx='2' fill='%23A5DAF2'/><rect x='13' y='136' width='12' height='36' rx='2' fill='%23FFA9C2'/></svg>") 0 0/38px 176px repeat-y;animation:film 12s linear infinite}
.filmstrip.left{left:14px}
.filmstrip.right{right:14px;animation-direction:reverse}
@keyframes film{to{background-position:0 176px}}
@media (min-width:1320px){.drape,.filmstrip{display:block}}
@media (min-width:1320px) and (max-width:1420px){.filmstrip{display:none}}
/* 英字の見出しに蛍光ペン */
.sec-head .en,.news-head .en{background:linear-gradient(transparent 58%,var(--lime) 58% 90%,transparent 90%);padding-inline:4px;margin-left:-4px}

/* ---------- 看板 ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:28px;align-items:end}
.en-label{margin:0 0 12px;font-family:var(--display);font-size:13px;letter-spacing:.16em;color:var(--blue)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(52px,9.5vw,112px);line-height:1;letter-spacing:.01em}
.lede{margin:18px 0 0;max-width:58ch;color:var(--muted)}
.lede b{color:var(--ink);font-weight:700}
.lede b.num{font-weight:400;color:var(--blue);font-size:18px}
.stamp{display:table;margin-top:12px;padding:3px 14px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);font-size:12px;color:var(--ink)}

.hist{display:grid;gap:6px;margin:0;padding:16px 18px 12px;background:var(--paper);border:2px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
.hist-cap{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.hist-cap span:first-child{font-weight:700;color:var(--ink)}
.hist-bars{display:grid;grid-template-columns:repeat(15,1fr);align-items:end;gap:3px;height:78px;border-bottom:2px solid var(--ink)}
.hist-bars span{display:block;background:var(--hair);border-radius:3px 3px 0 0;min-height:2px;transition:background .2s}
.hist-bars span.on{background:var(--blue)}
.hist-ticks{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;font-family:var(--display);font-size:10px;color:var(--faint)}
.hist-ticks span{white-space:nowrap}

/* 観たい作品のポスターが流れる帯 */
.belt{margin:30px -16px 0;overflow:hidden;background:var(--sun);border-block:2px solid var(--ink);padding-block:16px}
.belt-track{display:flex;gap:16px;width:max-content;padding-inline:8px;animation:belt 80s linear infinite}
.belt a{display:block;flex:none}
.belt img{display:block;width:78px;aspect-ratio:5/7;object-fit:cover;background:var(--hair);border:2px solid var(--ink);border-radius:8px}
.belt a:nth-child(odd) img{transform:rotate(-3deg)}
.belt a:nth-child(even) img{transform:rotate(2.5deg)}
.belt:hover .belt-track{animation-play-state:paused}
@keyframes belt{to{transform:translateX(-50%)}}

/* ---------- 見出し（英字＋明朝） ---------- */
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:48px 0 16px}
.sec-head .en{font-family:var(--display);font-size:clamp(32px,5vw,46px);line-height:1}
.sec-head .ja{font-family:var(--body);font-weight:700;font-size:14px;letter-spacing:.24em;color:var(--blue)}

/* ---------- 絞り込み ---------- */
.controls{display:grid;gap:16px;padding:22px 24px;background:var(--paper);border:2px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
.ctl{display:grid;grid-template-columns:8em 1fr;gap:10px;align-items:start}
.ctl>label,.ctl>.lbl{padding-top:6px;font-size:12.5px;font-weight:700;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.45;white-space:nowrap;transition:background .15s,transform .15s}
.chip:hover{background:var(--lime)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip small{margin-left:5px;font-family:var(--display);font-size:11px;opacity:.75}
.chip:disabled{opacity:.4;cursor:default;background:var(--paper)}
.hint{font-size:12px;color:var(--muted)}
.row-inline{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
input[type="time"],input[type="search"],select{background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:5px 10px;font-size:13px}
input[type="time"]{font-family:var(--display)}
input[type="search"]{width:min(100%,320px)}
input::placeholder{color:var(--faint)}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.switch input{accent-color:var(--blue);width:17px;height:17px}
.more{background:none;border:0;color:var(--blue);cursor:pointer;font-size:13px;font-weight:700;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}

/* ---------- ツールバー ---------- */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;
  padding:10px 2px;background:var(--bg);border-bottom:2px solid var(--ink)}
.count{font-size:13px;color:var(--muted)}
.count b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--blue);margin-right:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:13px;font-weight:700}
.btn:hover{background:var(--lime)}
.btn.lime{background:var(--lime)}
.btn.ghost{border-color:var(--hair);color:var(--muted);font-weight:500}

.picked{margin-top:16px;padding:14px 18px;background:var(--lime);border:2px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.picked .hint{font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--ink)}
.picked b{font-size:17px}

/* ---------- 上映作品（カード） ---------- */
.band{display:flex;align-items:center;gap:12px;width:max-content;max-width:100%;margin:36px 0 16px;padding:8px 10px 8px 20px;
  background:var(--c,var(--paper));border:2px solid var(--ink);border-radius:999px}
.band h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2}
.band span{font-family:var(--display);font-size:13px;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:1px 11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 18px}
.card{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--paper);border:2px solid var(--ink);border-radius:16px;overflow:hidden;
  transition:transform .15s,box-shadow .15s;scroll-margin-top:110px}
.card:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ink)}
.card.hl{outline:4px solid var(--blue);outline-offset:3px;box-shadow:6px 6px 0 var(--ink)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 8px 12px;background:var(--c,var(--paper));border-bottom:2px solid var(--ink)}
.no{font-family:var(--display);font-size:22px;line-height:1;letter-spacing:.02em}
.rt{font-family:var(--display);font-size:12px;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.rt b{font-weight:400;font-size:17px}
.poster{display:block;aspect-ratio:5/7;max-width:100%;background:var(--hair);border-bottom:2px solid var(--ink);overflow:hidden}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.poster .ph{display:grid;place-items:center;height:100%;padding:12px;text-align:center;font-family:var(--display);font-size:18px;color:var(--muted)}
.card-body{display:grid;gap:6px;align-content:start;padding:12px 12px 14px}
.t{margin:0;font-size:15px;font-weight:700;line-height:1.4;text-wrap:balance;overflow-wrap:anywhere}
.t a{text-decoration:none}
.t a:hover{text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:2px;text-underline-offset:3px}
.meta{margin:0;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.times{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:0;font-size:12px}
.clock{font-family:var(--display);font-size:13px;white-space:nowrap}
.clock .late{color:var(--late)}
.score{white-space:nowrap;color:var(--muted)}
.score b{font-family:var(--display);font-weight:400;font-size:14px;color:var(--blue)}
.vod{display:flex;flex-wrap:wrap;gap:4px}
.v{font-size:10.5px;line-height:1.45;padding:1px 8px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);text-decoration:none;white-space:nowrap}
.v:hover{background:var(--lime)}
.v.svod{background:var(--blue-soft);font-weight:700}
.v.mine{background:var(--blue);border-color:var(--blue);color:#fff}
.v.theater{background:var(--pink)}
.v.none{border-style:dashed;border-color:var(--faint);color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.b{font-size:10.5px;font-weight:700;line-height:1.45;padding:1px 7px;border-radius:6px;white-space:nowrap}
.b.clip{background:var(--lime);border:1.5px solid var(--ink)}
.b.rank{border:1.5px solid var(--hair);color:var(--muted);font-weight:500}
.b.rank b{font-family:var(--display);font-weight:400;color:var(--ink)}
.b.award{background:var(--sun);border:1.5px solid var(--ink)}
.b.sim{background:var(--pink);border:1.5px solid var(--ink)}
.b.seen{border:1.5px dashed var(--faint);color:var(--muted)}
details{font-size:12px}
summary{cursor:pointer;color:var(--blue);font-weight:700;width:max-content}
details p{margin:6px 0 0;color:var(--ink)}
.people{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:4px 12px}
.links a{color:var(--blue)}

.more-wrap{display:flex;justify-content:center;margin-top:30px}
.more-wrap .btn{padding:10px 26px;font-size:14px;box-shadow:4px 4px 0 var(--ink)}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.fin{display:grid;justify-items:center;gap:10px;margin:80px 0 0}
.fin .en{font-family:var(--display);font-size:clamp(44px,8vw,76px);line-height:1}
.fin .ja{font-family:var(--body);font-weight:700;font-size:14px;letter-spacing:.24em;color:var(--blue)}
.foot{margin:20px auto 0;max-width:62ch;text-align:center;font-size:12px;color:var(--faint)}

/* イラスト */
.illo-pop{display:inline-block;width:.9em;margin-left:.12em;vertical-align:-.06em;transform:rotate(8deg)}  /* 「今夜」の行の中に収め、下の行や英字に重ねない */
.illo-pop .illo,.illo-slot .illo{display:block;width:100%;height:auto}
.illo-slot{margin-left:auto;width:112px;align-self:center;transform:rotate(-6deg)}
.illo-slot.tilt{transform:rotate(7deg)}
.fin .illo-slot{margin:0 0 6px;width:104px;transform:rotate(-8deg)}

/* タブ */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.tab{display:grid;justify-items:start;padding:9px 20px 10px 16px;border:2px solid var(--ink);border-radius:18px;background:var(--paper);cursor:pointer;
  font-size:16px;font-weight:700;line-height:1.25;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.tab .tab-en{font-family:var(--display);font-weight:400;font-size:11px;letter-spacing:.14em;color:var(--blue)}
.tab b{font-family:var(--display);font-weight:400;font-size:12px;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--lime);border:1.5px solid var(--ink);color:var(--ink)}
.tab:hover{background:var(--lime)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:none;transform:translate(3px,3px)}
.tab[aria-selected="true"] .tab-en{color:var(--lime)}

/* 映画館 */
.th-note{margin:14px 0 0;font-size:12px;color:var(--muted)}
.th-list{display:grid;gap:18px;margin-top:18px}
.th-card{background:var(--paper);border:2px solid var(--ink);border-radius:18px;overflow:hidden}
.th-card.hl,.mv-card.hl{outline:4px solid var(--blue);outline-offset:3px}
.th-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 14px;padding:12px 16px;background:var(--c,var(--paper));border-bottom:2px solid var(--ink)}
.th-head h3{margin:0;font-size:17px;line-height:1.35}
.th-meta{margin:2px 0 0;font-size:12px;color:var(--ink)}
.dist{font-family:var(--display);font-size:13px;padding:1px 10px;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;white-space:nowrap}
.fav{display:inline-block;margin-left:6px;padding:1px 8px;font-size:11px;background:var(--lime);border:1.5px solid var(--ink);border-radius:999px;vertical-align:2px;white-space:nowrap}
.th-links{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.th-links a{color:var(--blue);font-weight:700}
.th-movies{list-style:none;margin:0;padding:4px 16px 8px}
.th-movies li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1.5px dashed var(--hair)}
.th-movies li:first-child{border-top:0}
.th-poster{display:block;width:48px;aspect-ratio:5/7;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--hair)}
.th-poster img{display:block;width:100%;height:100%;object-fit:cover}
.th-title{margin:0;font-size:14px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.th-title a{text-decoration:none}
.th-title .rt{margin-left:6px;font-size:11px;vertical-align:1px}
.scr{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
.fmt{font-size:10.5px;color:var(--muted);margin-right:2px}
.tm{font-family:var(--display);font-size:13px;padding:1px 9px;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper)}
.tm.past{opacity:.35;text-decoration:line-through}
.mv-card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:16px;background:var(--paper);border:2px solid var(--ink);border-radius:18px}
.mv-poster{display:block;width:96px;aspect-ratio:5/7;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--hair)}
.mv-poster img{display:block;width:100%;height:100%;object-fit:cover}
.mv-card h3{margin:0;font-size:16px;line-height:1.4}
.mv-card h3 a{text-decoration:none}
.mv-theaters{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.mv-theaters li{padding:8px 0 6px;border-top:1.5px dashed var(--hair)}
.mv-th{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;font-weight:700}
.mv-more summary{margin-top:8px}
button.v{cursor:pointer;font:inherit;font-size:10.5px;font-weight:700}

/* イベント */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px 18px}
.ev-card{background:var(--paper);border:2px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
.ev-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:12px 16px;background:var(--c,var(--paper));border-bottom:2px solid var(--ink)}
.ev-head h3{margin:0;font-size:16px;line-height:1.35}
.ev-head a{font-size:12px;font-weight:700;color:var(--ink)}
.ev-list{list-style:none;margin:0;padding:4px 16px 12px}
.ev-list li{display:grid;gap:3px;padding:11px 0;border-top:1.5px dashed var(--hair)}
.ev-list li:first-child{border-top:0}
.ev-list a{font-size:13.5px;font-weight:700;line-height:1.45;text-decoration:none;overflow-wrap:anywhere}
.ev-list a:hover{text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:2px;text-underline-offset:3px}
.ev-list p{margin:0;font-size:12px;color:var(--muted)}
.ev-list time{font-family:var(--display);font-size:11px;color:var(--faint)}
.ev-list .notice a{font-weight:500;color:var(--muted)}
.ev-list .b{justify-self:start}
.ev-sub{margin:14px 0 0;font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--blue)}
.ev-sub:first-child{margin-top:4px}
.ev-empty{padding:14px 0;font-size:12.5px;color:var(--muted)}

/* 変わったこと */
.news{margin-top:26px;padding:16px 20px 12px;background:var(--paper);border:2px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink)}
.news-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:4px}
.news-head .en{font-family:var(--display);font-size:22px;line-height:1}
.news-head .ja{font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--blue)}
.news-head .since{margin-left:auto;font-size:11.5px;color:var(--faint)}
.news ul{list-style:none;margin:0;padding:0}
.news li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:8px 0;border-top:1.5px dashed var(--hair);font-size:13.5px}
.news li:first-child{border-top:0}
.news .new{font-family:var(--display);font-size:10px;padding:1px 7px;border-radius:999px;background:var(--lime);border:1.5px solid var(--ink)}
.news .kind{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;border:1.5px solid var(--ink);background:var(--c,var(--paper))}
.news .txt{flex:1 1 16em;min-width:0;overflow-wrap:anywhere}
.news .txt a,.news .txt button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--blue);text-underline-offset:3px}
.news time{font-family:var(--display);font-size:11px;color:var(--faint)}
.news details summary{margin-top:6px;font-size:12px}

/* 名前で絞り込み・共有 */
.name{font:inherit;color:var(--blue);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(30,43,220,.35);text-underline-offset:3px}
.name:hover{text-decoration-color:var(--blue)}
.dir{margin:0;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.card-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.share{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:1px 10px;cursor:pointer}
.share:hover{background:var(--lime)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);
  padding:10px 16px;background:var(--ink);color:#fff;border-radius:12px;font-size:13px;box-shadow:4px 4px 0 var(--blue)}

/* 公開予定 */
.co-date{display:flex;align-items:center;gap:12px;margin:28px 0 12px}
.co-date h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;padding:6px 16px;background:var(--c,var(--sky));border:2px solid var(--ink);border-radius:999px}
.co-date span{font-size:12px;color:var(--muted)}
.co-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.co-card{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px;background:var(--paper);border:2px solid var(--ink);border-radius:16px}
.co-poster{display:block;width:72px;aspect-ratio:5/7;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--hair)}
.co-poster img{display:block;width:100%;height:100%;object-fit:cover}
.co-card h4{margin:0;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.co-card h4 a{text-decoration:none}
.co-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.co-btns a,.co-btns button{font:inherit;font-size:11.5px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.co-btns .cal{background:var(--lime)}

/* おまかせのステッカー（右下で回る） */
.sticker{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:120px;height:120px;padding:0;
  display:grid;place-items:center;border-radius:50%;border:2px solid var(--ink);background:var(--lime);cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .15s}
.sticker:hover{transform:translate(-2px,-2px) rotate(-6deg)}
.sticker svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);animation:spin 18s linear infinite}
.sticker text{font-family:var(--display);font-size:10px;fill:var(--ink)}
.sticker-label{position:relative;display:grid;justify-items:center;font-size:12px;font-weight:700;line-height:1.15}
.sticker-label b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:2px solid var(--ink)}
  .tab{justify-items:center;text-align:center;border:0;border-radius:12px;box-shadow:none;padding:6px 2px;font-size:12.5px}

  .ctl{grid-template-columns:1fr;gap:5px}
  .ctl>label,.ctl>.lbl{padding-top:0}
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
  .card-top{padding:6px 7px 6px 9px}
  .no{font-size:17px}

  .rt b{font-size:14px}

  .t{font-size:13.5px}

  .wrap{padding-top:60px}
  .spark.extra{display:none}
  .illo-slot{width:74px}
  .tab{font-size:14px;padding:8px 14px 9px 12px}
  .th-movies{padding:2px 12px 6px}
  .mv-card{grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px}
  .mv-poster{width:64px}
  .sticker text{font-size:9px}
  .sticker-label{font-size:10.5px}
  .sticker-label b{font-size:19px}
}

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = new Date().toISOString().slice(0,10);
const KEY = "konya-nani-miru-v2";
const POOL_OPTS = [
  {id:"clip", label:"観たい"},
  {id:"pick", label:"観たい以外のおすすめ"},
  {id:"all", label:"ぜんぶ"},
];
const KIND_OPTS = [
  {id:"vod", label:"配信の人気作", test: m => m.ranks.some(r => r.list !== "今話題")},
  {id:"trend", label:"今話題", test: m => m.ranks.some(r => r.list === "今話題")},
  {id:"similar", label:"観たいに似ている", test: m => m.similar > 0},
  {id:"award", label:"映画賞", test: m => (m.awards || []).length > 0},
];
const STEP = 100;  // 一度に表示する本数
const RUNTIME_OPTS = [
  {id:"all", label:"こだわらない", min:0, max:Infinity},
  {id:"90", label:"〜90分", min:0, max:90},
  {id:"120", label:"〜2時間", min:0, max:120},
  {id:"150", label:"〜2時間半", min:0, max:150},
  {id:"long", label:"2時間半より長い", min:151, max:Infinity},
];
const WHERE_OPTS = [
  {id:"home", label:"家で（配信あり）"},
  {id:"theater", label:"映画館で上映中"},
  {id:"all", label:"すべて"},
];
const DEFAULTS = {kinds:[], pool:"clip", where:"home", services:["U-NEXT","Prime Video"], svodOnly:false, runtime:"all", start:"", genres:[], country:"", minScore:0, q:"", sort:"runtime-asc"};
let DATA = null, MOVIES = [], SERVICES = [], GENRES = [];
let THEATER_N = new Map();  // 観たい作品ID -> 近くで上映している館数
let tstate = {date: null, view: "theater", fav: false, movie: null};
let state = load();
let pickedId = null;
let showAllGenres = false;
let limit = STEP;

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY) || "{}"); return {...DEFAULTS, ...s, q:""}; }
  catch(e){ return {...DEFAULTS}; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- derived ---------- */
const isSvod = v => v.kinds.some(k => k.includes("見放題"));
const inTheater = m => m.status === "上映中" || m.theaters > 0;
const upcoming = m => m.release && m.release > TODAY;
const bestRank = m => m.ranks && m.ranks.length ? Math.min(...m.ranks.map(r => r.rank)) : null;
function countBy(list){ const c = new Map(); list.forEach(x => c.set(x,(c.get(x)||0)+1)); return [...c].sort((a,b)=>b[1]-a[1]); }

function startMinutes(){
  if(state.start){ const [h,mm] = state.start.split(":").map(Number); return h*60+mm; }
  const d = new Date(); return Math.ceil((d.getHours()*60+d.getMinutes())/5)*5;
}
function hhmm(total){
  const day = Math.floor(total/1440), t = ((total%1440)+1440)%1440;
  return (day>0?"翌":"") + Math.floor(t/60) + ":" + String(t%60).padStart(2,"0");
}
function fmtLen(min){ const h = Math.floor(min/60), m = min%60; return h ? `${h}時間${m?m+"分":""}` : `${m}分`; }
function fmtStamp(s){ const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(s || ""); return m ? `${Number(m[2])}月${Number(m[3])}日 ${m[4]}` : (s || ""); }

function vodMatches(m){
  let v = m.vod;
  if(state.services.length) v = v.filter(x => state.services.includes(x.name));
  if(state.svodOnly) v = v.filter(isSvod);
  return v.length > 0;
}
/** skip: 件数を数えるとき、その条件だけ外して数えるためのキー */
function passes(m, skip){
  if(skip !== "pool" && state.pool !== "all" && m.source !== state.pool) return false;
  if(skip !== "kind" && state.pool === "pick" && state.kinds.length &&
     !KIND_OPTS.filter(k => state.kinds.includes(k.id)).some(k => k.test(m))) return false;
  if(skip !== "where"){
    if(state.where === "home" && !vodMatches(m)) return false;
    if(state.where === "theater" && !inTheater(m)) return false;
  }
  if(skip !== "runtime"){
    const r = RUNTIME_OPTS.find(o => o.id === state.runtime) || RUNTIME_OPTS[0];
    if(r.id !== "all" && (m.runtime == null || m.runtime < r.min || m.runtime > r.max)) return false;
  }
  if(skip !== "genre" && state.genres.length && !m.genres.some(g => state.genres.includes(g))) return false;
  if(skip !== "country"){
    if(state.country === "__jp" && !m.countries.includes("日本")) return false;
    if(state.country === "__foreign" && (m.countries.includes("日本") || !m.countries.length)) return false;
    if(state.country && !state.country.startsWith("__") && !m.countries.includes(state.country)) return false;
  }
  if(state.minScore && !(m.score >= state.minScore)) return false;
  if(state.q){
    const hay = [m.title, m.original, ...m.directors, ...m.cast].join(" ").toLowerCase();
    if(!state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;
  }
  return true;
}
function countWith(key, value, skip){
  const keep = state[key]; state[key] = value;
  const n = MOVIES.filter(m => passes(m, skip)).length;
  state[key] = keep; return n;
}
const nullLast = (a,b,f) => (a==null) - (b==null) || (a==null ? 0 : f(a,b));
const SORTS = {
  "runtime-asc": (a,b) => nullLast(a.runtime,b.runtime,(x,y)=>x-y) || (b.score||0)-(a.score||0),
  "runtime-desc": (a,b) => nullLast(a.runtime,b.runtime,(x,y)=>y-x) || (b.score||0)-(a.score||0),
  "score-desc": (a,b) => nullLast(a.score,b.score,(x,y)=>y-x) || (b.clips||0)-(a.clips||0),
  "clips-desc": (a,b) => (b.clips||0)-(a.clips||0),
  "rank-asc": (a,b) => nullLast(bestRank(a),bestRank(b),(x,y)=>x-y) || (b.score||0)-(a.score||0),
  "similar-desc": (a,b) => (b.similar||0)-(a.similar||0) || (b.score||0)-(a.score||0),
  "year-desc": (a,b) => nullLast(a.release||a.year,b.release||b.year,(x,y)=>String(y).localeCompare(String(x))),
  "year-asc": (a,b) => nullLast(a.release||a.year,b.release||b.year,(x,y)=>String(x).localeCompare(String(y))),
  "order-asc": (a,b) => a.order-b.order,
  "order-desc": (a,b) => b.order-a.order,
  "title-asc": (a,b) => a.title.localeCompare(b.title,"ja"),
};
function band(m){
  const r = m.runtime;
  if(r == null) return "上映時間の登録なし";
  if(r < 90) return "90分未満";
  if(r < 120) return "90〜119分";
  if(r < 150) return "2時間〜2時間29分";
  return "2時間半以上";
}

/* ---------- controls ---------- */
function chip(label, pressed, data, count, disabled){
  return `<button type="button" class="chip" aria-pressed="${pressed}" ${data}${disabled?" disabled":""}>${esc(label)}${count!=null?`<small>${count}</small>`:""}</button>`;
}
function renderControls(){
  $("pool").innerHTML = POOL_OPTS.map(o => chip(o.label, state.pool===o.id, `data-pool="${o.id}"`, countWith("pool", o.id))).join("");
  const L = DATA.lists || {};
  const svc = Object.keys(L).filter(k => k !== "今話題").map(k => k.replace("人気","")).join("・");
  $("poolHint").textContent = state.pool === "clip"
    ? "Filmarksで「観たい」に入れた作品です。"
    : `観たい以外は、${svc}の人気上位、今話題の映画、観たいに似ている作品（上位${DATA.similar_top || 0}本）、${(DATA.awards || []).join("・")}の受賞作です。観た作品（${DATA.marks}本）と観たい作品は除いています。`;
  $("kindRow").hidden = state.pool !== "pick";
  $("kinds").innerHTML = KIND_OPTS.map(k => {
    const n = MOVIES.filter(m => passes(m, "kind") && k.test(m)).length;
    return chip(k.label, state.kinds.includes(k.id), `data-kind="${k.id}"`, n);
  }).join("");

  $("where").innerHTML = WHERE_OPTS.map(o => chip(o.label, state.where===o.id, `data-where="${o.id}"`, countWith("where", o.id))).join("");
  const home = state.where === "home";
  $("svcRow").style.opacity = home ? "" : ".5";
  $("services").innerHTML = SERVICES.map(([name]) => {
    const n = MOVIES.filter(m => passes(m, "where") && m.vod.some(v => v.name === name && (!state.svodOnly || isSvod(v)))).length;
    return chip(name, state.services.includes(name), `data-svc="${esc(name)}"`, n, !home);
  }).join("");
  $("svodOnly").checked = state.svodOnly; $("svodOnly").disabled = !home;
  $("svcHint").textContent = state.services.length
    ? `${state.services.join("・")}で観られる作品だけ表示中。選んだサービスは次回も覚えています`
    : "何も選ばなければ、どこかで配信している作品をすべて表示します";

  $("runtime").innerHTML = RUNTIME_OPTS.map(o => chip(o.label, state.runtime===o.id, `data-rt="${o.id}"`, countWith("runtime", o.id))).join("");
  const s = startMinutes(), r = RUNTIME_OPTS.find(o => o.id === state.runtime);
  $("start").value = hhmm(s).replace("翌","").padStart(5,"0");
  $("rtHint").textContent = r && isFinite(r.max) && r.min === 0
    ? `${hhmm(s)}に観はじめて ${hhmm(s + r.max)} までに終わる作品`
    : `右端に「${hhmm(s)}に観はじめたら何時に終わるか」を出しています`;

  const g = showAllGenres ? GENRES : GENRES.slice(0, 12);
  $("genres").innerHTML = g.map(([name]) => {
    const n = MOVIES.filter(m => m.genres.includes(name) && passes(m, "genre")).length;
    return chip(name, state.genres.includes(name), `data-genre="${esc(name)}"`, n);
  }).join("") + (GENRES.length > 12 ? `<button class="more" type="button" id="moreGenres">${showAllGenres ? "閉じる" : `ほか${GENRES.length-12}ジャンル`}</button>` : "");

  const base = MOVIES.filter(m => passes(m, "country"));
  const jp = base.filter(m => m.countries.includes("日本")).length;
  $("country").innerHTML = `<option value="">国：すべて（${base.length}）</option><option value="__jp">日本の作品（${jp}）</option><option value="__foreign">日本以外（${base.length-jp}）</option>` +
    countBy(base.flatMap(m => m.countries)).filter(([c]) => c !== "日本").slice(0, 15).map(([c,n]) => `<option value="${esc(c)}">${esc(c)}（${n}）</option>`).join("");
  $("country").value = state.country;
  if($("country").value !== state.country) $("country").value = "";
  $("minScore").value = String(state.minScore);
  $("sort").value = state.sort;
  if($("q").value !== state.q) $("q").value = state.q;
}

/* ---------- header ---------- */
function renderHeader(list){
  const clips = MOVIES.filter(m => m.source === "clip");
  const picks = MOVIES.length - clips.length;
  const total = clips.reduce((s,m) => s + (m.runtime||0), 0);
  $("lede").innerHTML = `Filmarksで「観たい」に入れた映画 <b class="num">${clips.length}</b>本（全部観ると <b>${Math.floor(total/60)}時間</b>）と、観たい以外のおすすめ <b class="num">${picks}</b>本。` +
    `<span class="stamp">${esc(fmtStamp(DATA.fetched_at))} 更新・${esc(DATA.update_note || "")}</span>`;
  const pool = MOVIES.filter(m => state.pool === "all" || m.source === state.pool);
  const buckets = Array(15).fill(0), on = Array(15).fill(0);
  const idx = r => r < 60 ? 0 : Math.min(14, Math.floor((r-60)/10)+1);
  pool.forEach(m => { if(m.runtime != null) buckets[idx(m.runtime)]++; });
  list.forEach(m => { if(m.runtime != null) on[idx(m.runtime)]++; });
  const max = Math.max(1, ...buckets);
  $("histBars").innerHTML = buckets.map((n,i) => {
    const lo = i===0 ? "60分未満" : i===14 ? "190分以上" : `${60+(i-1)*10}〜${69+(i-1)*10}分`;
    return `<span class="${on[i] ? "on" : ""}" style="height:${n/max*100}%" title="${lo}：${n}本（表示中 ${on[i]}本）"></span>`;
  }).join("");
  const ticks = {0:"〜59", 4:"90", 7:"120", 10:"150", 13:"180"};
  $("histTicks").innerHTML = buckets.map((_,i) => `<span>${ticks[i] ?? ""}</span>`).join("");
  $("histNote").textContent = `${POOL_OPTS.find(o => o.id === state.pool).label}・色つき＝いまの条件`;
}

/* ---------- list ---------- */
function vodChips(m){
  const mine = new Set(state.services);
  const out = [];
  const nearN = THEATER_N.get(m.id);
  if(nearN) out.push(`<button type="button" class="v theater" data-tmovie="${m.id}">近くの${nearN}館で上映中 ▶</button>`);
  else if(inTheater(m)) out.push(`<a class="v theater" href="${esc(m.url)}/theaters" target="_blank" rel="noopener">映画館で上映中${m.theaters ? ` ${m.theaters}館` : ""}</a>`);
  else if(upcoming(m)) out.push(`<span class="v theater">${esc(m.release.replace(/-/g,"/"))} 公開</span>`);
  const vods = [...m.vod].sort((a,b) => (mine.has(b.name)-mine.has(a.name)) || (isSvod(b)-isSvod(a)));
  // 札は契約中のサービスだけ（未選択なら見放題を3社まで）。ほかは「ほか◯社」にまとめてカードを短く保つ
  let shown = state.services.length ? vods.filter(v => mine.has(v.name)) : vods.filter(isSvod).slice(0, 3);
  if(!shown.length) shown = vods.slice(0, state.services.length ? 1 : 2);
  const rest = vods.length - shown.length;
  shown.forEach(v => {
    const cls = ["v", isSvod(v) ? "svod" : "", mine.has(v.name) && (!state.svodOnly || isSvod(v)) ? "mine" : ""].join(" ");
    out.push(`<a class="${cls}" href="${esc(v.href)}" target="_blank" rel="noopener nofollow">${esc(v.name)} ${esc(v.kinds.join("・"))}</a>`);
  });
  if(rest) out.push(`<a class="v none" href="${esc(m.url)}/vod" target="_blank" rel="noopener">ほか${rest}社</a>`);
  if(!m.vod.length && !inTheater(m) && !upcoming(m)) out.push(`<span class="v none">配信なし</span>`);
  return out.join("");
}
function badges(m){
  const out = [];
  if(m.source === "clip" && state.pool !== "clip") out.push(`<span class="b clip">観たい</span>`);
  if(m.watched) out.push(`<span class="b seen">観た</span>`);
  (m.awards || []).forEach(a => out.push(`<span class="b award">${esc(a)}</span>`));
  if(m.similar) out.push(`<span class="b sim">観たい${m.similar}本に似ている</span>`);
  (m.ranks || []).forEach(r => out.push(`<span class="b rank">${esc(r.list)} <b>${r.rank}位</b></span>`));
  return out.length ? `<div class="badges">${out.join("")}</div>` : "";
}
const BAND_COLOR = {"90分未満":"var(--mint)","90〜119分":"var(--sun)","2時間〜2時間29分":"var(--sky)","2時間半以上":"var(--pink)","上映時間の登録なし":"var(--paper)"};
function card(m, start, no){
  const endMin = m.runtime ? start + m.runtime : null;
  const meta = [m.year && `${m.year}年`, m.countries.slice(0,2).join("・"), m.genres.slice(0,2).join("・")].filter(Boolean).map(esc).join(" ／ ");
  const names = list => list.map(n => `<button type="button" class="name" data-person="${esc(n)}">${esc(n)}</button>`).join("、");
  const people = m.cast.length ? `出演 ${names(m.cast.slice(0,5))}` : "";
  const links = [
    `<a href="${esc(m.url)}" target="_blank" rel="noopener">${m.source === "pick" ? "Filmarksで開く（観たいに追加できます）" : "Filmarksで開く"}</a>`,
    m.trailer ? `<a href="${esc(m.trailer)}" target="_blank" rel="noopener nofollow">予告編</a>` : "",
    m.official ? `<a href="${esc(m.official)}" target="_blank" rel="noopener nofollow">公式サイト</a>` : "",
    `<a href="${esc(m.url)}/vod" target="_blank" rel="noopener">配信サービスをすべて見る</a>`,
  ].filter(Boolean).join("");
  const clock = endMin != null
    ? `<span class="clock">${hhmm(start)} → <span${endMin >= 1440 ? ' class="late"' : ""}>${hhmm(endMin)}</span></span>` : "";
  return `<article class="card${m.id===pickedId?" hl":""}" id="m-${m.id}" style="--c:${BAND_COLOR[band(m)]}">
    <div class="card-top"><span class="no">${String(no).padStart(3,"0")}</span><span class="rt">${m.runtime ? `<b>${m.runtime}</b>分` : "時間未登録"}</span></div>
    <a class="poster" href="${esc(m.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${m.poster ? `<img src="${m.poster}" alt="" loading="lazy" decoding="async">` : `<span class="ph">${esc(m.title.slice(0,8))}</span>`}</a>
    <div class="card-body">
      ${badges(m)}
      <h3 class="t"><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a></h3>
      ${meta ? `<p class="meta">${meta}</p>` : ""}
      ${m.directors.length ? `<p class="dir">監督 ${names(m.directors.slice(0,2))}</p>` : ""}
      <p class="times">${clock}<span class="score"><b>★${m.score != null ? m.score.toFixed(1) : "—"}</b> 観たい${(m.clips||0).toLocaleString()}人</span></p>
      <div class="vod">${vodChips(m)}</div>
      <div class="card-actions"><button type="button" class="share" data-share="${m.id}">共有</button>
      <details><summary>${m.synopsis ? "あらすじ・くわしく" : "くわしく"}</summary>${m.original ? `<p>${esc(m.original)}</p>` : ""}${people ? `<p class="people">${people}</p>` : ""}${m.synopsis ? `<p>${esc(m.synopsis)}</p>` : ""}<p class="links">${links}</p></details></div>
    </div>
  </article>`;
}
function render(){
  let list = MOVIES.filter(m => passes(m)).sort(SORTS[state.sort] || SORTS["runtime-asc"]);
  renderControls();
  renderHeader(list);
  const mins = list.reduce((s,m) => s + (m.runtime||0), 0);
  $("count").innerHTML = `<b>${list.length}</b> 本表示中・合計 ${fmtLen(mins)}`;
  const start = startMinutes();
  const all = list;
  list = list.slice(0, limit);
  const rest = all.length - list.length;
  $("moreWrap").hidden = !rest;
  $("moreBtn").textContent = `もっと見る（あと${rest}本）`;
  $("fin").hidden = !list.length || rest > 0;
  if(!list.length){
    $("list").innerHTML = `<p class="empty">この条件に合う作品はありません。「条件をリセット」で最初の状態に戻せます。</p>`;
  } else if(state.sort.startsWith("runtime")){
    const bandTotal = {};
    all.forEach(m => { const b = band(m); bandTotal[b] = (bandTotal[b] || 0) + 1; });
    let html = "", cur = null, buf = [], no = 0;
    const flush = () => { if(cur){ html += `<div class="band" style="--c:${BAND_COLOR[cur]}"><h2>${cur}</h2><span>${bandTotal[cur]}本</span></div><div class="grid">${buf.map(m=>card(m,start,++no)).join("")}</div>`; } };
    list.forEach(m => { const b = band(m); if(b !== cur){ flush(); cur = b; buf = []; } buf.push(m); });
    flush();
    $("list").innerHTML = html;
  } else {
    $("list").innerHTML = `<div class="grid">${list.map((m,i)=>card(m,start,i+1)).join("")}</div>`;
  }
  $("foot").textContent = `データ：Filmarks（${fmtStamp(DATA.fetched_at)} 時点）。配信状況と評価は取得時点のもので、最新の状況は各サービスでご確認ください。${DATA.failed.length ? `取得できなかった観たい作品：${DATA.failed.length}本。` : ""}`;
  save();
  return all;
}

document.addEventListener("click", e => {

  else return;
  render();
});
$("svodOnly").addEventListener("change", e => { limit = STEP; state.svodOnly = e.target.checked; render(); });
$("start").addEventListener("change", e => { limit = STEP; state.start = e.target.value; render(); });
$("country").addEventListener("change", e => { limit = STEP; state.country = e.target.value; render(); });
$("minScore").addEventListener("change", e => { limit = STEP; state.minScore = Number(e.target.value); render(); });
$("sort").addEventListener("change", e => { limit = STEP; state.sort = e.target.value; render(); });
let qTimer;
$("q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); limit = STEP; if(DATA) render(); }, 150); });

function pick(){
  const list = MOVIES.filter(m => passes(m));
  if(!list.length){ $("picked").innerHTML = `<div class="picked">条件に合う作品がないので選べませんでした。条件をゆるめてからもう一度どうぞ。</div>`; return; }
  const pool = list.filter(m => m.id !== pickedId);
  const src = pool.length ? pool : list;
  const m = src[Math.floor(Math.random() * src.length)];
  pickedId = m.id;
  const sorted = list.sort(SORTS[state.sort] || SORTS["runtime-asc"]);
  const pos = sorted.findIndex(x => x.id === m.id);
  if(pos >= limit) limit = Math.ceil((pos + 1) / STEP) * STEP;
  const start = startMinutes();
  $("picked").innerHTML = `<div class="picked"><span class="hint">TONIGHT'S PICK</span><b>${esc(m.title)}</b><span class="num">${m.runtime ? `${m.runtime}分・${hhmm(start)} → ${hhmm(start+m.runtime)}` : ""}</span><button class="more" type="button" id="pickBtn2">別のにする</button></div>`;
  render();
  $("pickBtn2").onclick = pick;
  document.getElementById("m-" + m.id)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}

const TABS = ["movies", "theaters", "coming", "events"];
function showTab(tab, keepScroll){
  if(!TABS.includes(tab)) tab = "movies";
  state.tab = tab; save();
  TABS.forEach(t => {
    $("panel-" + t).hidden = t !== tab;
    document.querySelector(`[data-tab="${t}"]`).setAttribute("aria-selected", String(t === tab));
  });
  $("pickBtn").hidden = tab !== "movies";
  if(tab === "theaters") renderTheaters();
  if(tab === "events") renderEvents();
  if(tab === "coming") renderComing();
  try{ history.replaceState(null, "", tab === "movies" ? location.pathname + location.search : "#" + tab); }catch(e){}

/* ---------- 映画館 ---------- */
const localISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function dayLabel(iso){
  const today = new Date(); const t0 = localISO(today);
  const t1 = localISO(new Date(today.getTime() + 864e5)), t2 = localISO(new Date(today.getTime() + 1728e5));
  const d = new Date(iso + "T00:00:00");
  const md = `${d.getMonth()+1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}）`;
  return (iso === t0 ? "今日 " : iso === t1 ? "明日 " : iso === t2 ? "あさって " : "") + md;
}
const fmtDist = m => m < 1000 ? `${m}m` : `${(m/1000).toFixed(1)}km`;
const favFirst = (a, b) => (b.fav - a.fav) || (a.distance - b.distance);  // よく行く3館を先に、ほかは近い順
const toMin = hm => { const [h, m] = String(hm).split(":").map(Number); return h*60 + m; };
function timeRows(screens, isToday){
  const now = new Date(), cur = now.getHours()*60 + now.getMinutes();
  return screens.map(sc => `<div class="scr">${sc.formats.length ? `<span class="fmt">${esc(sc.formats.join("・"))}</span>` : ""}${
    sc.times.map(([st, en]) => `<span class="tm${isToday && toMin(st) < cur ? " past" : ""}" title="${esc(st)}〜${esc(en)}">${esc(st)}</span>`).join("")}</div>`).join("");
}
function earliest(show){ return Math.min(...show.screens.flatMap(sc => sc.times.map(t => toMin(t[0])))); }
function renderTheaters(){
  const T = DATA.theater || {dates: [], theaters: [], shows: []};
  const today = localISO(new Date());
  const dates = T.dates.filter(d => d >= today && T.shows.some(s => s.date === d));
  const byId = new Map(MOVIES.map(m => [m.id, m]));
  const thMap = new Map(T.theaters.map(t => [t.id, t]));
  const origin = (T.origin && T.origin.name) || "大岡山駅";
  if(!dates.length){
    $("tDates").innerHTML = ""; $("tViews").innerHTML = "";
    $("tNote").textContent = "";
    $("theaterBody").innerHTML = `<p class="empty">観たいに入れた作品で、いま${esc(origin)}の近くで上映しているものは見つかりませんでした。上映時刻は毎朝の更新で取り直します。</p>`;
    return;
  }
  if(!dates.includes(tstate.date)) tstate.date = dates[0];
  const isToday = tstate.date === today;
  $("tDates").innerHTML = dates.map(d => chip(dayLabel(d), tstate.date === d, `data-tdate="${d}"`,
    new Set(T.shows.filter(s => s.date === d).map(s => s.movie)).size)).join("");
  $("tViews").innerHTML = chip("映画館ごと", tstate.view === "theater", 'data-tview="theater"') +
    chip("作品ごと", tstate.view === "movie", 'data-tview="movie"') +
    chip("★よく行く映画館だけ", tstate.fav, 'data-tfav="1"');
  const seenKey = new Set();
  const shows = T.shows.filter(s => s.date === tstate.date && byId.has(s.movie) && thMap.has(s.theater) && (!tstate.fav || thMap.get(s.theater).fav))
    .filter(s => { const k = s.movie + "-" + s.theater; if(seenKey.has(k)) return false; seenKey.add(k); return true; });
  const nTh = new Set(shows.map(s => s.theater)).size, nMv = new Set(shows.map(s => s.movie)).size;
  $("tNote").textContent = `よく行く3館を先に、ほかは${origin}から近い順（${Math.round((T.theaters.at(-1)?.distance || 0)/1000)}km以内）。${dayLabel(tstate.date)}は${nTh}館で、観たいに入れた${nMv}本を上映しています。上映時刻は ${fmtStamp(DATA.fetched_at)} 時点のFilmarksの情報です。${isToday ? "過ぎた回はうすく表示しています。" : ""}`;
  if(!shows.length){ $("theaterBody").innerHTML = `<p class="empty">この条件で上映している映画館はありません。</p>`; return; }
  const group = key => { const g = new Map(); shows.forEach(s => { const k = s[key]; if(!g.has(k)) g.set(k, []); g.get(k).push(s); }); return g; };
  const poster = (m, cls) => `<a class="${cls}" href="${esc(m.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${m.poster ? `<img src="${m.poster}" alt="" loading="lazy" decoding="async">` : ""}</a>`;
  const thHead = t => `<header class="th-head" style="--c:${t.fav ? "var(--sun)" : "var(--paper)"}">
      <div><h3>${esc(t.name)}${t.fav ? '<span class="fav">★よく行く</span>' : ""}</h3><p class="th-meta"><span class="dist">${fmtDist(t.distance)}</span> ${esc(t.area || "")}エリア</p></div>
      <div class="th-links">${t.official ? `<a href="${esc(t.official)}" target="_blank" rel="noopener nofollow">公式サイト・上映時間</a>` : ""}<a href="${esc(t.page)}" target="_blank" rel="noopener">Filmarks</a></div></header>`;
  let html = "";
  if(tstate.view === "theater"){
    const g = group("theater");
    const ths = [...g.keys()].map(id => thMap.get(id)).filter(Boolean).sort(favFirst);
    html = `<div class="th-list">${ths.map(t => `<article class="th-card" id="th-${t.id}">${thHead(t)}
      <ul class="th-movies">${g.get(t.id).sort((a,b) => earliest(a) - earliest(b)).map(s => { const m = byId.get(s.movie); return `<li>${poster(m, "th-poster")}
        <div><p class="th-title"><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a>${m.runtime ? `<span class="rt"><b>${m.runtime}</b>分</span>` : ""}</p>${timeRows(s.screens, isToday)}</div></li>`; }).join("")}</ul></article>`).join("")}</div>`;
  } else {
    const g = group("movie");
    const mvs = [...g.keys()].map(id => byId.get(id)).sort((a,b) =>
      Math.min(...g.get(a.id).map(s => thMap.get(s.theater).distance)) - Math.min(...g.get(b.id).map(s => thMap.get(s.theater).distance)));
    const li = s => { const t = thMap.get(s.theater); return `<li><div class="mv-th">${esc(t.name)}${t.fav ? '<span class="fav">★</span>' : ""}<span class="dist">${fmtDist(t.distance)}</span></div>${timeRows(s.screens, isToday)}</li>`; };
    html = `<div class="th-list">${mvs.map(m => { const ss = g.get(m.id).sort((a,b) => favFirst(thMap.get(a.theater), thMap.get(b.theater)));
      return `<article class="mv-card${tstate.movie === m.id ? " hl" : ""}" id="tm-${m.id}">${poster(m, "mv-poster")}<div>
        <h3><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a></h3>
        <p class="meta">${m.runtime ? `${m.runtime}分 ／ ` : ""}近くの${ss.length}館で上映</p>
        <ul class="mv-theaters">${ss.slice(0, 5).map(li).join("")}</ul>
        ${ss.length > 5 ? `<details class="mv-more"><summary>ほか${ss.length - 5}館</summary><ul class="mv-theaters">${ss.slice(5).map(li).join("")}</ul></details>` : ""}
      </div></article>`; }).join("")}</div>`;
  }
  $("theaterBody").innerHTML = html;
}

/* ---------- イベント ---------- */
const EVENT_WORDS = /舞台挨拶|上映|イベント|中継|応援|試写|トーク|登壇|キャンペーン|プレゼント|先行|最速|記念|特集|限定/;
function renderEvents(){
  const E = DATA.events;
  if(!E){ $("evTheaters").innerHTML = `<p class="empty">イベント情報はまだありません。次の更新で取り込みます。</p>`; $("evFilmarks").innerHTML = ""; return; }

  const item = (e, notice) => `<li class="${notice ? "notice" : ""}"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>${clipBadge(e)}${e.text ? `<p>${esc(e.text)}</p>` : ""}${e.posted ? `<time>${esc(e.posted)} 掲載</time>` : ""}</li>`;

    <article class="ev-card"><header class="ev-head" style="--c:var(--lime)"><h3>FILMAGAのお知らせ（試写会・プレゼント）</h3><a href="https://filmaga.filmarks.com/writers/premium-ticket/" target="_blank" rel="noopener">一覧 ↗</a></header>
      <ul class="ev-list">${stale("articles")}${A.map(a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>${clipBadge(a)}${a.posted ? `<time>${esc(a.posted)} 掲載</time>` : ""}</li>`).join("") || `<li class="ev-empty">いま告知されているものはありません。</li>`}</ul></article>`;

/* ---------- 共有 ---------- */
function toast(msg){
  let t = document.querySelector(".toast");
  if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
}
async function shareMovie(m){
  const text = `『${m.title}』${m.runtime ? `（${m.runtime}分）` : ""}${m.score != null ? ` ★${m.score.toFixed(1)}` : ""}`;
  if(navigator.share){
    try{ await navigator.share({title: m.title, text, url: m.url}); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(`${text}\n${m.url}`); toast("作品名とリンクをコピーしました"); }
  catch(e){ toast(`${text} ${m.url}`); }
}

/* ---------- 公開予定 ---------- */
function calUrl(m){
  const d = m.release.replace(/-/g, "");
  const next = localISO(new Date(new Date(m.release + "T00:00:00").getTime() + 864e5)).replace(/-/g, "");
  const q = new URLSearchParams({action: "TEMPLATE", text: `『${m.title}』公開`, dates: `${d}/${next}`,
    details: `${m.runtime ? `${m.runtime}分 ／ ` : ""}${m.url}`});
  return "https://calendar.google.com/calendar/render?" + q.toString();
}
function comingList(){
  const today = localISO(new Date());
  return MOVIES.filter(m => m.release && m.release > today).sort((a,b) => a.release.localeCompare(b.release) || (b.clips||0) - (a.clips||0));
}
function renderComing(){
  const all = comingList();
  const clips = all.filter(m => m.source === "clip"), picks = all.filter(m => m.source === "pick").slice(0, 40);
  $("coNote").textContent = `観たいに入れた作品 ${clips.length}本と、観たい以外で話題の公開予定 ${picks.length}本を公開日順に並べています。「カレンダーに追加」を押すとGoogleカレンダーの予定作成画面が開きます（登録するかはそこで決められます）。`;
  const card = m => `<article class="co-card"><a class="co-poster" href="${esc(m.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${m.poster ? `<img src="${m.poster}" alt="" loading="lazy" decoding="async">` : ""}</a>
    <div>${badges(m)}<h4><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a></h4>
      <p class="meta">${[m.runtime && `${m.runtime}分`, m.countries.slice(0,2).join("・"), m.genres.slice(0,2).join("・")].filter(Boolean).map(esc).join(" ／ ")}</p>
      <div class="co-btns"><a class="cal" href="${esc(calUrl(m))}" target="_blank" rel="noopener">カレンダーに追加</a><button type="button" data-share="${m.id}">共有</button></div></div></article>`;
  const byDate = list => { const g = new Map(); list.forEach(m => { if(!g.has(m.release)) g.set(m.release, []); g.get(m.release).push(m); }); return g; };
  const section = (title, list, color) => {
    if(!list.length) return "";
    return `<div class="sec-head" style="margin-top:36px"><span class="ja" style="font-size:15px">${title}</span></div>` +
      [...byDate(list)].map(([d, ms]) => `<div class="co-date" style="--c:${color}"><h3>${esc(dayLabel(d))}</h3><span>${ms.length}本</span></div><div class="co-list">${ms.map(card).join("")}</div>`).join("");
  };
  $("comingBody").innerHTML = (section("観たいに入れた作品", clips, "var(--sun)") + section("観たい以外で話題の公開予定", picks, "var(--sky)"))
    || `<p class="empty">これから公開される作品は、いまのところ見つかりませんでした。</p>`;
}

/* ---------- 変わったこと ---------- */
const KIND_LABEL = {svod: ["見放題に", "var(--mint)"], vod: ["配信開始", "var(--mint)"], theater: ["上映開始", "var(--sky)"],
  ending: ["終了間近", "var(--pink)"], event: ["イベント", "var(--sun)"], release: ["公開間近", "var(--sky)"], clip: ["観たいに追加", "var(--lime)"]};
function renderNews(){
  const C = DATA.changes || [];
  const box = $("news");
  if(!C.length){ box.hidden = true; return; }
  const today = (DATA.fetched_at || "").slice(0, 10);
  const byId = new Map(MOVIES.map(m => [m.id, m]));
  const li = c => {
    const [label, color] = KIND_LABEL[c.kind] || ["お知らせ", "var(--paper)"];
    const m = c.movie && byId.get(c.movie);
    let body = esc(c.text);
    if(c.kind === "theater" && m) body = `<button type="button" data-tmovie="${m.id}">${esc(c.text)}</button>`;
    else if(c.url) body = `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.text)}</a>`;
    return `<li>${c.date === today ? '<span class="new">NEW</span>' : ""}<span class="kind" style="--c:${color}">${label}</span><span class="txt">${body}</span><time>${esc(c.date.slice(5).replace("-", "/"))}</time></li>`;
  };
  box.innerHTML = `<div class="news-head"><span class="en">NEWS</span><span class="ja">おしらせ</span><span class="since">毎朝の更新で前日と比べています（${3}日分）</span></div>
    <ul>${C.slice(0, 5).map(li).join("")}</ul>${C.length > 5 ? `<details><summary>ほか${C.length - 5}件</summary><ul>${C.slice(5).map(li).join("")}</ul></details>` : ""}`;
  box.hidden = false;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b || !DATA) return;
  if(b.dataset.person){  // 監督・出演者の名前で絞り込み
    state.q = b.dataset.person; $("q").value = state.q; limit = STEP;
    showTab("movies", true); render();
    document.getElementById("list").scrollIntoView({block: "start"});
    toast(`「${state.q}」の作品に絞り込みました（検索欄を消すと元に戻ります）`);
    return;
  }
  if(b.dataset.share){ const m = MOVIES.find(x => x.id === Number(b.dataset.share)); if(m) shareMovie(m); }
});

/* ---------- boot ---------- */
$("list").innerHTML = `<p class="empty">作品データを読み込んでいます…</p>`;
fetch("data.json", {cache: "no-cache"})
  .then(r => { if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(d => {
    DATA = d; MOVIES = d.movies;
    SERVICES = countBy(MOVIES.flatMap(m => [...new Set(m.vod.map(v => v.name))]));
    GENRES = countBy(MOVIES.flatMap(m => m.genres));
    state.services = state.services.filter(s => SERVICES.some(([n]) => n === s));
    const belt = MOVIES.filter(m => m.source === "clip" && m.poster).sort((a,b) => (b.score||0)-(a.score||0)).slice(0, 18)
      .map(m => `<a href="${esc(m.url)}" target="_blank" rel="noopener" tabindex="-1"><img src="${m.poster}" alt="" decoding="async"></a>`).join("");
    $("belt").innerHTML = belt + belt;  // 2周分並べて切れ目なく流す
    const T = d.theater || {shows: []};
    const todayISO = localISO(new Date());
    const firstDate = (T.dates || []).find(x => x >= todayISO && T.shows.some(s => s.date === x));
    T.shows.filter(s => s.date === firstDate).forEach(s => {
      const set = THEATER_N.get(s.movie) || new Set(); set.add(s.theater); THEATER_N.set(s.movie, set);
    });
    THEATER_N.forEach((v, k) => THEATER_N.set(k, v.size));
    const nMv = THEATER_N.size, nEv = (d.events?.theaters || []).filter(e => EVENT_WORDS.test(e.title)).length;
    if(nMv){ $("tabTheaterN").hidden = false; $("tabTheaterN").textContent = nMv; }
    if(nEv){ $("tabEventN").hidden = false; $("tabEventN").textContent = nEv; }
    const nCo = comingList().filter(m => m.source === "clip").length;
    if(nCo){ $("tabComingN").hidden = false; $("tabComingN").textContent = nCo; }
    renderNews();
    render();
    const hashTab = location.hash.replace("#", "");
    showTab(TABS.includes(hashTab) ? hashTab : (state.tab || "movies"), true);
    setInterval(() => { if(!state.start) render(); }, 5 * 60 * 1000);
  })
  .catch(e => { $("list").innerHTML = `<p class="empty">作品データ（data.json）を読み込めませんでした：${esc(e.message)}。ページを再読み込みしてください。</p>`; });
</script>
