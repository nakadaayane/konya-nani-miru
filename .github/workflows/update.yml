name: 毎日の更新

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 6:00（日本時間）。GitHub側の混雑で数十分遅れることがある
  workflow_dispatch: # Actions タブの「Run workflow」から手動でも動かせる
  push:
    branches: [main]
    paths: ["template.html", "update.py", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Filmarks から取り直す
        run: python update.py --public

      # リポジトリの更新が60日止まると GitHub が定期実行を止めるので、毎日データをコミットしておく
      - name: データを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
